# Model catalog for server-local assets.
# The current web UI is manual-first. Entries here document future assisted
# labeling and keyframe-sampling backends; weights are not committed to Git.

- id: yolo26_detect_n
  display_name: YOLO26 Nano Detect
  family: yolo26
  type: detection
  backend: ultralytics_yolo
  local_path: models/detection/yolo26n.pt
  role: assisted_labeling

- id: yolo26_detect_m
  display_name: YOLO26 Medium Detect
  family: yolo26
