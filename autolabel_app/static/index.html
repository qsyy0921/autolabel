<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autolabel Manual Labeling</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260604-ai-status" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>Autolabel Manual</h1>
          <p id="status">服务器负责抽帧、存储与可选 AI 辅助，人工确认后保存最终标注。</p>
        </div>
        <div class="stats">
          <div class="stat-card">
            <span>Frames</span>
            <strong id="frameCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Annotations</span>
            <strong id="annotationCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Sampler</span>
            <strong id="samplerBadge">-</strong>
          </div>
        </div>
      </header>

      <section class="control-band">
        <form id="uploadForm" class="upload-form manual">
          <label class="field">
            <span>项目名</span>
            <input id="projectNameInput" name="project_name" type="text" placeholder="例如 dinggan-seg-v1" />
          </label>

          <label class="field field-file">
            <span>视频</span>
            <input id="videoInput" name="video" type="file" accept="video/*" />
          </label>

          <label class="field field-wide">
            <span>服务器视频路径</span>
            <input id="serverVideoPathInput" name="server_video_path" type="text" placeholder="/home/.../video.mp4" />
          </label>

          <label class="field">
            <span>间隔秒</span>
            <input id="intervalInput" name="interval_sec" type="number" value="2" min="0.2" step="0.2" />
          </label>

          <label class="field">
            <span>最多帧</span>
            <input id="maxFramesInput" name="max_frames" type="number" value="12" min="1" max="120" />
          </label>

          <div class="actions">
            <button id="uploadButton" type="submit" class="primary" title="创建项目并使用平衡关键帧抽帧">创建手工标注项目</button>
            <button id="exportButton" type="button" title="导出当前项目的 COCO JSON">导出 COCO</button>
            <button id="downloadButton" type="button" title="下载项目标注包">下载结果</button>
          </div>
        </form>
      </section>

      <main class="workspace">
        <section class="review-panel">
          <div class="panel-head review-head">
            <h2>关键帧</h2>
            <span id="projectMeta">等待项目</span>
          </div>
          <div class="toolbar">
            <div class="tool-group">
              <button id="selectTool" type="button" class="active" title="选择/移动对象">选择</button>
              <button id="rectTool" type="button" title="拖拽画矩形；画完后 Ctrl+F 选择标签">矩形</button>
              <button id="polygonTool" type="button" title="单击添加多边形点；Enter 或双击完成；Esc 取消">多边形</button>
              <button id="circleTool" type="button" title="拖拽画圆形；画完后 Ctrl+F 选择标签">圆形</button>
            </div>
            <div class="tool-group">
              <button id="finishPolygonButton" type="button" title="Enter：完成当前多边形">完成多边形</button>
              <button id="deleteButton" type="button" title="Delete / Backspace：删除选中对象">删除</button>
              <button id="saveButton" type="button" class="primary" title="切换帧时会自动保存，也可以手动保存当前帧">保存当前帧</button>
            </div>
            <div class="tool-group ai-tools">
              <label class="ai-toggle" title="开启后可用 Ctrl+J 精修、Ctrl+K 查找同类；关闭时保持纯手工标注">
                <input id="aiAssistToggle" type="checkbox" />
                <span>AI 辅助标注</span>
              </label>
              <input id="samPromptInput" type="text" placeholder="SAM3.1 prompt / label" title="可选：SAM3.1 文本提示；不填则使用当前对象 label；没有 label 时使用 object" />
              <button id="samRefineButton" type="button" title="Ctrl+J：用 SAM3.1 精修当前选中对象的 mask">AI 精修</button>
              <button id="samFindButton" type="button" title="Ctrl+K：用 SAM3.1 查找当前帧同类候选对象">查找同类</button>
              <span id="aiStatus" class="ai-status" title="AI 请求状态会显示在这里">未开启</span>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="canvas" width="960" height="540" title="画布：拖拽创建/移动对象；A/S 切帧；Ctrl+F 选标签；Ctrl+J 精修；Ctrl+K 查找同类；Esc 取消"></canvas>
            <div id="emptyState" class="empty-state">上传视频后开始抽帧并手工标注</div>
          </div>
          <div id="frameList" class="frame-strip" aria-label="关键帧序列" title="关键帧序列：点击缩略图切换；A 上一帧，S 下一帧，切换时自动保存"></div>
        </section>

        <aside class="inspector-panel">
          <div class="panel-head">
            <h2>标注检查</h2>
            <span id="selectedMeta">0 selected</span>
          </div>
          <div class="label-overview">
            <section class="label-section">
              <div class="section-title">定义 Label</div>
              <div class="label-create">
                <input id="newLabelInput" type="text" placeholder="输入新 label 名称" title="输入 label 后按 Enter 或点击添加" />
                <button id="addLabelButton" type="button" title="添加 label 到当前视频标签列表">添加</button>
              </div>
            </section>
            <section class="label-section">
              <div class="section-title">本帧已标注 Label</div>
              <div id="frameLabelSummary" class="label-chip-list"></div>
            </section>
            <section class="label-section">
              <div class="section-title">本视频 Label 种类</div>
              <div id="videoLabelSummary" class="label-chip-list"></div>
            </section>
            <section class="label-section">
              <div class="section-title">快捷键</div>
              <div class="shortcut-list">
                <span title="上一张关键帧；切换前自动保存当前帧"><kbd>A</kbd> 上一帧</span>
                <span title="下一张关键帧；切换前自动保存当前帧"><kbd>S</kbd> 下一帧</span>
                <span title="给当前选中对象选择或新增标签"><kbd>Ctrl</kbd><kbd>F</kbd> 选择标签</span>
                <span title="需要先开启 AI 辅助标注；用 SAM3.1 精修当前对象"><kbd>Ctrl</kbd><kbd>J</kbd> AI 精修当前对象</span>
                <span title="需要先开启 AI 辅助标注；用 SAM3.1 查找当前帧同类候选"><kbd>Ctrl</kbd><kbd>K</kbd> AI 查找当前帧同类</span>
                <span title="多边形工具下完成当前多边形"><kbd>Enter</kbd> 完成多边形</span>
                <span title="删除当前选中的标注对象"><kbd>Delete</kbd> 删除选中对象</span>
                <span title="取消拖拽、多边形草稿或关闭标签弹窗"><kbd>Esc</kbd> 取消当前操作</span>
              </div>
            </section>
          </div>
          <div id="annotationCategoryPicker" class="annotation-category-picker"></div>
          <div id="annotationList" class="annotation-list"></div>
        </aside>
      </main>
    </div>
    <div id="labelModal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="label-modal" role="dialog" aria-modal="true" aria-labelledby="labelModalTitle">
        <div class="panel-head modal-head">
          <h2 id="labelModalTitle">选择标签种类</h2>
          <span id="labelModalMeta">Ctrl+F</span>
        </div>
        <div class="label-modal-body">
          <div id="labelModalOptions" class="modal-option-list"></div>
          <div class="label-create modal-create">
            <input id="modalNewLabelInput" type="text" placeholder="新增 label 后直接应用到当前对象" title="输入后按 Enter：新增并应用到当前对象" />
            <button id="modalAddLabelButton" type="button" title="新增 label 并应用到当前对象">新增并应用</button>
          </div>
        </div>
      </div>
    </div>
    <script src="/static/app.js?v=20260604-ai-status"></script>
  </body>
</html>
